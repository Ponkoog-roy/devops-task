services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: devops-intern-app
    ports:
      - "8080:8080"
    restart: unless-stopped
    read_only: true

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    tmpfs:
      - /tmp

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >
          import urllib.request,sys;
          sys.exit(
          0 if urllib.request.urlopen(
          'http://127.0.0.1:8080/health',
          timeout=2
          ).status == 200
          else 1
          )
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s