<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260" font-family="Helvetica,Arial,sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="1000" height="260" fill="#f8fafc"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">End-to-End Workflow</text>

  <g stroke-width="2">
    <rect x="30"  y="80" width="190" height="100" rx="12" fill="#dbeafe" stroke="#2563eb"/>
    <rect x="270" y="80" width="190" height="100" rx="12" fill="#ede9fe" stroke="#7c3aed"/>
    <rect x="510" y="80" width="190" height="100" rx="12" fill="#cffafe" stroke="#0891b2"/>
    <rect x="750" y="80" width="220" height="100" rx="12" fill="#dcfce7" stroke="#16a34a"/>
  </g>

  <g text-anchor="middle" fill="#0f172a">
    <text x="125" y="115" font-size="26">1</text>
    <text x="125" y="140" font-size="16" font-weight="bold">Code Commit</text>
    <text x="125" y="160" font-size="12">git push to main</text>

    <text x="365" y="115" font-size="26">2</text>
    <text x="365" y="140" font-size="16" font-weight="bold">GitHub Actions CI</text>
    <text x="365" y="160" font-size="12">lint → build → smoke test</text>

    <text x="605" y="115" font-size="26">3</text>
    <text x="605" y="140" font-size="16" font-weight="bold">Docker Hub</text>
    <text x="605" y="160" font-size="12">push :latest and :sha</text>

    <text x="860" y="115" font-size="26">4</text>
    <text x="860" y="140" font-size="16" font-weight="bold">Deployment on VPS</text>
    <text x="860" y="160" font-size="12">SSH → docker pull → run</text>
  </g>

  <g stroke="#334155" stroke-width="3" marker-end="url(#a)">
    <line x1="222" y1="130" x2="266" y2="130"/>
    <line x1="462" y1="130" x2="506" y2="130"/>
    <line x1="702" y1="130" x2="746" y2="130"/>
  </g>

  <text x="500" y="225" text-anchor="middle" font-size="13" fill="#475569">Secrets used: DOCKERHUB_USERNAME, DOCKERHUB_TOKEN, VPS_HOST, VPS_USER, VPS_SSH_KEY</text>
</svg>
