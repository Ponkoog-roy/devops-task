name: CI

on:
  push:
    branches: [main]

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/devops-intern-task

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Lint Python (flake8)
        run: |
          pip install flake8
          flake8 app.py --max-line-length=100

      - name: Lint Bash (shellcheck)
        run: shellcheck system_health.sh

      - name: Lint Dockerfile (hadolint)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile

  build-and-push:
    name: Build, test & push image
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # 1) Verify the image builds and actually serves traffic
      - name: Build image (verification, not pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE_NAME }}:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test container
        run: |
          docker run -d --name smoke -p 8080:8080 "$IMAGE_NAME:test"
          for i in $(seq 1 15); do
            curl -fs http://localhost:8080/ && exit 0
            sleep 1
          done
          docker logs smoke
          exit 1

      # 2) Push to Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha

  # Optional: auto-deploy to a VPS. Enable by setting repo variable DEPLOY_ENABLED=true
  # and secrets VPS_HOST, VPS_USER, VPS_SSH_KEY.
  deploy:
    name: Deploy to VPS (optional)
    runs-on: ubuntu-latest
    needs: build-and-push
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/devops-intern-task:latest
            docker rm -f devops-intern-task || true
            docker run -d --name devops-intern-task --restart unless-stopped \
              -p 80:8080 ${{ secrets.DOCKERHUB_USERNAME }}/devops-intern-task:latest
