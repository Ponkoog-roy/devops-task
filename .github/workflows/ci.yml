name: CI

on:
  push:
    branches:
      - main

permissions:
  contents: write

env:
  IMAGE_NAME: ponkoog/devops-task

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install flake8
        run: pip install flake8

      - name: Lint Python
        run: flake8 app.py --max-line-length=100

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Lint Bash
        run: shellcheck system_health.sh

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile

  build-and-push:
    name: Build Test Push
    runs-on: ubuntu-latest
    needs: lint

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Read and Increment Version
        id: version
        shell: bash
        run: |
          VERSION=$(cat VERSION)

          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"

          PATCH=$((PATCH + 1))

          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"

          echo "version=${NEW_VERSION}" >> $GITHUB_OUTPUT

      - uses: docker/setup-buildx-action@v3

      - name: Build Image (Verification)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE_NAME }}:test

      - name: Smoke Test
        run: |
          docker run -d --name smoke -p 8080:8080 "$IMAGE_NAME:test"

          for i in $(seq 1 15); do
            if curl -fs http://localhost:8080/health; then
              docker rm -f smoke
              exit 0
            fi
            sleep 1
          done

          docker logs smoke
          docker rm -f smoke
          exit 1

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:v${{ steps.version.outputs.version }}
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

  update-version:
    name: Update Version File
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

      - name: Update VERSION file
        run: |
          echo "${{ needs.build-and-push.outputs.version }}" > VERSION

      - name: Commit VERSION update
        run: |
          git add VERSION

          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "chore: bump version to v${{ needs.build-and-push.outputs.version }}"
          git push

  deploy:
    name: Deploy to VPS (Optional)
    runs-on: ubuntu-latest
    needs: build-and-push
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}

    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            docker pull ponkoog/devops-task:latest

            docker rm -f devops-task || true

            docker run -d \
              --name devops-task \
              --restart unless-stopped \
              -p 80:8080 \
              ponkoog/devops-task:latest